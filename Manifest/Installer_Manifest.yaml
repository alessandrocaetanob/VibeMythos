# Release history for VibeMythos.
#
# Empty by design. This addon has its own Id (split from upstream Mythos in HYP-200), so
# upstream's 18 prior releases are NOT this addon's history - they belong to
# Mythos_9f42c1a7-... and their PackageUrls serve bansakai's binaries. Carrying them here
# would have advertised the wrong theme under this addon's identity.
#
# Add the first entry when a GitHub release actually exists, in this shape:
#
#   - Version: 2.1
#     RequiredApiVersion: 2.9.0
#     ReleaseDate: YYYY-MM-DD
#     PackageUrl: https://github.com/alessandrocaetanob/VibeMythos/releases/download/2.1/VibeMythos_fb4d738f-62bd-4e08-afd9-52e8cb45f6ca_2_1.pthm
#     Changelog:
#       - ...
#
# Version must match source/theme.yaml, and RequiredApiVersion must match its ThemeApiVersion.
# Never add an entry before the release asset exists - every user's updater would hit a 404.
AddonId: VibeMythos_fb4d738f-62bd-4e08-afd9-52e8cb45f6ca
Packages: []
