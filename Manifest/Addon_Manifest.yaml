Name: VibeMythos
Author: alessandrocaetanob (based on Mythos by bansakai)
SourceUrl: https://github.com/alessandrocaetanob/VibeMythos
ShortDescription: VibeMythos is a Fluent UI inspired theme for Playnite Desktop Mode.
Description: A fork of Mythos by bansakai. VibeMythos blends Fluent UI with subtle design principles from the Epic Games Launcher to deliver a clean, visually balanced library experience, and builds on it with bundled typography, deeper plugin integrations and a cinematic Details View.
