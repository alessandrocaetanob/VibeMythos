# Submission manifest for Playnite's addon database. NOT yet submitted, and nothing here is
# read at runtime: when InstallerManifestUrl starts with http, Playnite ignores this file and
# queries its own backend by AddonId instead (see AddonManifests.cs). This exists so the entry
# is ready to PR to JosefNemec/PlayniteAddonDatabase. Release 2.1 exists as of 2026-08-17,
# so the only thing left is the decision to submit - deliberately not taken yet.
#
# AddonId must stay in sync with source/theme.yaml's Id and Installer_Manifest.yaml's AddonId.
