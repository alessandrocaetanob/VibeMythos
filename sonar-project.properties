# SonarQube Cloud configuration for VibeMythos
# Docs: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope/

sonar.projectKey=alessandrocaetanob_VibeMythos
sonar.organization=alessandrocaetanob
sonar.projectName=VibeMythos
sonar.host.url=https://sonarcloud.io

# Keep in sync with `Version` in source/theme.yaml
sonar.projectVersion=2.1

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# XAML is XML. Register the suffix so the XML analyzer parses source/**/*.xaml —
# without this, the theme's ~79 XAML files are treated as unknown files and skipped.
sonar.xml.file.suffixes=.xml,.xsd,.xsl,.xaml

# README/store assets and binary media are not part of the packaged theme.
sonar.exclusions=Screenshots/**,Resources/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.ico,**/*.ttf,**/*.otf,**/*.ai,**/*.pthm

# This repo contains only WPF resource dictionaries and YAML manifests: there is no
# compiled code and no test framework is possible, so coverage is not a meaningful
# signal. Left unset, the quality gate would fail permanently on new-code coverage.
sonar.coverage.exclusions=**/*
sonar.cpd.exclusions=source/DefaultControls/**,source/Localization/**
